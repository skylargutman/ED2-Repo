# /etc/nginx/snippets/egnsite-ssl.conf
#
# Shared TLS settings, included by both server blocks in sciencelabtoyou.conf.
#
# This exists instead of `include /etc/letsencrypt/options-ssl-nginx.conf;`.
# That file is dropped in by certbot's *nginx plugin*, but enable-tls.sh uses
# `certbot certonly --webroot` on purpose (so certbot never rewrites our
# hand-written config), which means the file may not exist. Including a
# missing file makes `nginx -t` fail and takes the site down on reload.
#
# Values mirror certbot's recommended set.

ssl_session_cache   shared:EGNSite_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# TLS 1.2 and 1.3 only. 1.0/1.1 are deprecated and rejected by modern browsers.
ssl_protocols TLSv1.2 TLSv1.3;

# ECDHE suites only, so no Diffie-Hellman parameter file is needed -- that
# removes an `openssl dhparam` step that takes minutes on a 1-OCPU instance.
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# OCSP stapling — lets clients verify revocation without a round trip to the CA.
ssl_stapling on;
ssl_stapling_verify on;
resolver 169.254.169.254 valid=300s;   # OCI's resolver
resolver_timeout 5s;

# HSTS. Six months, no preload -- preload is very hard to undo, so it is left
# off deliberately for a lab site.
add_header Strict-Transport-Security "max-age=15768000" always;
