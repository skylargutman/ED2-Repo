# /etc/nginx/sites-available/sciencelabtoyou  (PRE-TLS STAGE)
#
# HTTP-only. Use this until DNS points at the instance and certbot has issued
# a certificate; then run deploy/enable-tls.sh to swap in the TLS config.
#
# Why this file exists: the TLS config references
# /etc/letsencrypt/live/sciencelabtoyou.com/fullchain.pem. If that file does
# not exist yet, `nginx -t` fails and nginx refuses to start -- so installing
# the TLS config first leaves you unable to serve the ACME challenge needed to
# obtain the very certificate it wants. This config breaks that cycle.
#
# It is fully functional: the whole site, the sensor WebSocket, and the video
# proxy all work over plain HTTP against the bare IP. Good for validating the
# stack before DNS resolves.
#
# server_name _ is a catch-all, so it answers on the IP or any hostname --
# which matters because the public IP is ephemeral.

upstream egnsite {
    server unix:/run/egnsite/gunicorn.sock fail_timeout=0;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    client_max_body_size 8M;

    access_log /var/log/nginx/egnsite.access.log;
    error_log  /var/log/nginx/egnsite.error.log;

    # Must stay reachable for certbot to issue and later renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /opt/ed2/ED2-Repo/WebInterface/collected_static/;
        expires 30d;
        access_log off;
    }

    # Sensor WebSocket. Over plain HTTP the browser connects with ws://
    # rather than wss://; the template picks the scheme automatically.
    location /ws/ {
        proxy_pass http://egnsite;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # WebRTC signalling -> MediaMTX. Keeps 8889 off the public interface.
    location /stream/whep/ {
        proxy_pass http://127.0.0.1:8889/pendulum/whep;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    location /stream/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://egnsite;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
