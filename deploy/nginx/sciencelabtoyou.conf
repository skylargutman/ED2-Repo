# /etc/nginx/sites-available/sciencelabtoyou
#
# Front door for the whole system. Three jobs:
#   1. Terminate TLS (certbot manages the cert lines below).
#   2. Reverse-proxy Django (gunicorn+uvicorn on a unix socket).
#   3. Reverse-proxy MediaMTX's WHEP endpoint so the browser can pull WebRTC
#      video from the same origin -- this is why 8889 never has to be public.
#
# Install:
#   sudo ln -s /etc/nginx/sites-available/sciencelabtoyou \
#              /etc/nginx/sites-enabled/sciencelabtoyou
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream egnsite {
    server unix:/run/egnsite/gunicorn.sock fail_timeout=0;
}

# ---------------------------------------------------------------------------
# HTTP :80 -- certbot challenge + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name sciencelabtoyou.com www.sciencelabtoyou.com 129.153.42.213;

    # Let certbot renew without taking the site down.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sciencelabtoyou.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Canonicalise www -> apex
# ---------------------------------------------------------------------------
server {
    # HTTP/2 via the `listen ... http2` parameter, NOT the standalone
    # `http2 on;` directive. The latter needs nginx >= 1.25.1, and Ubuntu
    # 24.04 ships 1.24 -- where it fails hard with
    #     [emerg] unknown directive "http2"
    # This form works on 1.24 and on 1.25+ (deprecation warning only).
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.sciencelabtoyou.com;

    ssl_certificate     /etc/letsencrypt/live/sciencelabtoyou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sciencelabtoyou.com/privkey.pem;
    include             /etc/nginx/snippets/egnsite-ssl.conf;

    return 301 https://sciencelabtoyou.com$request_uri;
}

# ---------------------------------------------------------------------------
# Main site
# ---------------------------------------------------------------------------
server {
    # See the note above: `listen ... http2`, not `http2 on;` (nginx 1.24).
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name sciencelabtoyou.com;

    ssl_certificate     /etc/letsencrypt/live/sciencelabtoyou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sciencelabtoyou.com/privkey.pem;
    include             /etc/nginx/snippets/egnsite-ssl.conf;

    # The dashboard posts JSON parameter payloads; keep a sane ceiling.
    client_max_body_size 8M;

    access_log /var/log/nginx/egnsite.access.log;
    error_log  /var/log/nginx/egnsite.error.log;

    # -----------------------------------------------------------------------
    # Static files -- served directly, never through Django.
    # Populated by `manage.py collectstatic` into collected_static/.
    # -----------------------------------------------------------------------
    location /static/ {
        alias /opt/ed2/ED2-Repo/WebInterface/collected_static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # -----------------------------------------------------------------------
    # WebSocket: live sensor feed.
    # MatlabApp/routing.py maps ^ws/sensor/$ to SensorDataConsumer, and
    # experiment_run_dynamic.html connects to wss://<host>/ws/sensor/.
    # Needs the Upgrade dance plus a long read timeout, otherwise nginx
    # silently drops the socket after 60s of a quiet experiment.
    # -----------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://egnsite;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # -----------------------------------------------------------------------
    # WebRTC video (WHEP).
    #
    # The page POSTs an SDP offer to /stream/whep/ and expects an SDP answer
    # back. MediaMTX exposes that at <webrtcAddress>/<path>/whep, and the Pi
    # publishes to path "pendulum" (see picamera/stream.sh: streamid=publish:pendulum).
    #
    # proxy_buffering must be off -- WHEP is a single small request/response
    # and buffering adds handshake latency for no benefit.
    # -----------------------------------------------------------------------
    location /stream/whep/ {
        proxy_pass http://127.0.0.1:8889/pendulum/whep;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # MediaMTX also needs ICE candidates to be PATCHable for trickle ICE.
    location /stream/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Django
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://egnsite;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this via SECURE_PROXY_SSL_HEADER to know the original
        # request was HTTPS. Without it, CSRF rejects POSTs from the dashboard.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
