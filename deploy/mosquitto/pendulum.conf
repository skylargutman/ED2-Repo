# /etc/mosquitto/conf.d/pendulum.conf
#
# The command-and-telemetry bus between the web server and the control Pi.
#
# Port 1885, not the MQTT default 1883. Every client in this system agrees on
# 1885 -- MatlabApp/mqtt_utils.py, WebInterface/mqtt_subscriber.py,
# picontrol/dac_daemon.py, picontrol/RemoteControl.cpp. Do not "fix" this to
# 1883; you would have to change all four.
#
# Topics carried:
#   pendulum/cmd      web -> Pi    {"command":"sta","experiment":...,"parameters":{...}}
#   pendulum/status   Pi  -> (*)   "online"/"offline"/"homing"/"running:X"/"stopped"
#   raspi/to_django   Pi  -> web   sensor telemetry, consumed by egnsite-mqtt
#
#   sudo systemctl restart mosquitto

listener 1885 0.0.0.0

# The Pi connects from a campus network with no client certs, and dac_daemon.py
# / mqtt_utils.py both connect without credentials. Anonymous access is what
# the system is built around today.
#
# SECURITY: this leaves anyone who can reach port 1885 able to publish to
# pendulum/cmd and start experiments on real hardware. See
# docs/open-questions.md for the password_file / TLS upgrade path.
allow_anonymous true

# Persist retained messages across broker restarts. dac_daemon.py publishes
# its status with retain=True and sets a Last Will of "offline", so a
# reconnecting dashboard immediately learns the rig's true state.
persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
log_type error
log_type warning
log_type notice

# Generous keepalive tolerance -- the Pi is on lab wifi.
max_keepalive 120
