services:
  backend:
    build:
      dockerfile: ../docker/backend/Dockerfile
      context: ../WebInterface
    depends_on: 
      database:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../WebInterface
        target: /home/lab_instruments/backend-app
    environment:
      DB_HOST: database
      DB_PORT: 3306
      EMAIL_VERIFICATION_SECRET: replace-me
      EMAIL_VERIFICATION_LINK: https://forms.google.com
    ports:
      - "8000:8000"
    command: >
      sh -c "/home/lab_instruments/web-venv/bin/uv run python manage.py migrate && /home/lab_instruments/web-venv/bin/python manage.py runserver 0.0.0.0:8000"
  database:
    image: mysql
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_PASSWORD: thissucks
      MYSQL_USER: petera
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

